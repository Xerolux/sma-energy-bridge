name: "SMA Energy Bridge (Beta)"
version: "0.4.1"
slug: "sma_energy_bridge"
description: "Bridge a SolarEdge SunSpec or custom Modbus TCP grid meter to SMA Speedwire. For display/testing only."
url: "https://github.com/Xerolux/sma-energy-bridge"
arch:
  - amd64
  - aarch64
startup: application
boot: manual
init: false
host_network: true
icon: true
logo: true
options:
  source_profile: solaredge_sunspec
  custom_modbus_function: 3
  custom_registers: []
  modbus_host: "REPLACE_ME"
  modbus_port: 502
  modbus_unit_id: 1
  meter_model_base: 40188
  power_sign: "export_positive"
  swap_counters: false
  meter_serial: 900000001
  frame_profile: compact
  susy_id: 270
  poll_interval_seconds: 5
  transmit_interval_seconds: 1
  stale_after_seconds: 15
  max_abs_power_w: 30000
  multicast_interface: ""
  unicast_host: ""
  transmit_enabled: false
schema:
  source_profile: list(solaredge_sunspec|custom_modbus)
  custom_modbus_function: int(3,4)
  custom_registers:
    - str
  modbus_host: str
  modbus_port: port
  modbus_unit_id: int
  meter_model_base: int
  power_sign: list(import_positive|export_positive)
  swap_counters: bool
  meter_serial: int
  frame_profile: list(compact|emeter20)
  susy_id: int
  poll_interval_seconds: int
  transmit_interval_seconds: int
  stale_after_seconds: int
  max_abs_power_w: int
  multicast_interface: str?
  unicast_host: str?
  transmit_enabled: bool
