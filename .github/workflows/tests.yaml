name: Tests
on:
  push:
  pull_request:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile sma_energy_bridge/main.py scripts/verify_against_ha.py scripts/make_icons.py
      - run: pip install ruff
      - run: ruff check .
  app-build:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Build and check the app image
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          version=$(sed -n 's/^version: "\(.*\)"$/\1/p' sma_energy_bridge/config.yaml)
          base=$(awk -v arch="$ARCH:" '$1 == arch {print $2}' sma_energy_bridge/build.yaml)
          test -n "$version" && test -n "$base"
          docker build --build-arg BUILD_FROM="$base" --build-arg BUILD_ARCH="$ARCH" --build-arg BUILD_VERSION="$version" -t sma-bridge-test sma_energy_bridge
          docker run --rm sma-bridge-test python3 /app/main.py --help
