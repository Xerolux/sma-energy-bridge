name: "SMA Energy Bridge (Experimental)"
version: "0.3.1"
slug: "sma_energy_bridge"
description: "SolarEdge SunSpec grid meter via existing Modbus TCP proxy as an SMA Speedwire Energy Meter. For display/testing only."
arch:
  - amd64
  - aarch64
startup: application
boot: manual
init: false
host_network: true
options:
  modbus_host: "REPLACE_ME"
  modbus_port: 502
  modbus_unit_id: 1
  meter_model_base: 40188
  power_sign: "export_positive"
  swap_counters: false
  meter_serial: 900000001
  susy_id: 270
  poll_interval_seconds: 5
  transmit_interval_seconds: 1
  stale_after_seconds: 15
  max_abs_power_w: 30000
  multicast_interface: ""
  transmit_enabled: false
schema:
  modbus_host: str
  modbus_port: port
  modbus_unit_id: int
  meter_model_base: int
  power_sign: list(import_positive|export_positive)
  swap_counters: bool
  meter_serial: int
  susy_id: int
  poll_interval_seconds: int
  transmit_interval_seconds: int
  stale_after_seconds: int
  max_abs_power_w: int
  multicast_interface: str?
  transmit_enabled: bool
